[voicera-poc]
; Dial 7000 from the registered softphone to reach the Voicera PoC agent.
; The bridge process (src/voicera_bridge.py) owns the "voicera-poc" Stasis
; app and answers the channel itself once it has the RTP/WS path ready.
exten => 7000,1,NoOp(Voicera PoC call)
 same => n,Stasis(voicera-poc)
 same => n,Hangup()

[from-vobiz]
; Inbound calls from the Vobiz SIP trunk. Any DID Vobiz sends us routes
; into the same Stasis app the softphone uses — no bridge changes needed.
exten => _X.,1,NoOp(Inbound call from Vobiz trunk: ${EXTEN})
 same => n,Stasis(voicera-poc)
 same => n,Hangup()
