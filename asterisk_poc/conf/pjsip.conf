; Minimal PJSIP config for the PoC: one transport + one endpoint for a
; softphone (Zoiper/Linphone) to register against, dialing extension 7000
; (see extensions.conf) to reach the Voicera bridge.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Asterisk was advertising its own internal Docker container IP in SDP
; (unreachable from the host), which is why no audio ever flowed in either
; direction. Advertise the host-reachable address instead — the one we
; actually publish the SIP/RTP ports on.
external_media_address=129.121.140.95
external_signaling_address=129.121.140.95

; PoC credentials only — change before pointing this at anything but a
; throwaway local Asterisk instance.
[softphone]
type=endpoint
context=voicera-poc
disallow=all
allow=ulaw
auth=softphone-auth
aors=softphone
direct_media=no
; NAT handling: Zoiper (on the Mac host) and Asterisk (inside Docker's
; network namespace) don't share an address space, so Zoiper's
; SDP-advertised RTP address (often 127.0.0.1, meaningless inside the
; container) must be ignored in favor of wherever media actually
; originates from, and SIP responses/Contact must go back to the real
; source instead of a claimed one.
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[softphone-auth]
type=auth
auth_type=userpass
username=softphone
password=softphone

; PJSIP registrar looks up the AOR by the SIP user in the REGISTER's To URI
; (here: "softphone"), NOT by the endpoint's `aors=` reference. So the AOR
; section name MUST match the SIP user. Endpoint / auth / AOR can share the
; same name because they have distinct `type=` values.
[softphone]
type=aor
max_contacts=1
; New REGISTERs from the same softphone use a fresh `rinstance` param each
; time, which PJSIP treats as a distinct contact. Without this flag, the
; second REGISTER hits the max_contacts=1 cap and is rejected with 403.
; With it, the new registration displaces the old one — correct behavior
; for a single-device account.
remove_existing=yes

; --- Vobiz inbound SIP trunk (IP-authenticated, no credentials) -----------
; Vobiz delivers inbound calls for DID +918071582936 to sip:129.121.140.95:5060
; sourced from these two signaling IPs (per Vobiz docs). The identify block
; matches incoming INVITEs by source IP and maps them onto the endpoint.
[vobiz-identify]
type=identify
endpoint=vobiz-trunk
match=13.233.44.61
match=3.111.255.163

[vobiz-trunk]
type=endpoint
context=from-vobiz
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
