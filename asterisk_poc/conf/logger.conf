; Minimal logger.conf for the PoC. Two goals:
;   1. Keep the noisy SIP-scanner NOTICE spam OUT of messages.log
;      (the file that grew to 7GB on 2026-09-05 — see ~/handoff_logs.md).
;      Console still receives NOTICE, so scan attempts remain visible via
;      `docker logs voicera_poc_asterisk`, whose json-file log is bounded
;      to 100MB (20MB x 5 files, set in asterisk_poc/docker-compose.yml).
;   2. Rotate strategy = rotate so `asterisk -rx 'logger rotate'` produces
;      predictable messages.log.0, .1, ... names for future ops.

[general]
rotatestrategy = rotate

; Channel definitions MUST live under [logfiles]. Without this section header
; Asterisk silently scopes them into [general] and drops them (verified on
; 22.10.1 — `logger show channels` returned empty until this was added).
[logfiles]
console => notice,warning,error
messages.log => warning,error
