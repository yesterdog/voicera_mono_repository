# Reverse proxy for voice.bindit.in — terminates TLS at 443, proxies to
# voice_server over the shared voicera_network via container-name DNS.
#
# This is the entrypoint for external clients (NeuraCX and any other
# webhook-driven telephony provider) that require wss://. The internal
# Asterisk-bridge → voice_server and jambonz-freeswitch → voice_server
# paths do NOT go through nginx — they talk directly to
# voicera_voice_server:7860 on voicera_network. So nginx being up or down,
# healthy or restarting, cannot disturb either softphone path.

# Docker's embedded resolver, needed so any references to container-name
# hostnames resolve dynamically. Valid=10s means nginx re-resolves if a
# container is recreated with a different IP.
resolver 127.0.0.11 valid=10s ipv6=off;

# Only the upstreams actively used here. The old host.docker.internal:*
# references (backend/stt/tts/application/server) were leftovers from the
# Docker Desktop config and don't resolve on this Linux VPS — dropping
# them so nginx can actually start. If you later stand up the frontend or
# an ai4bharat container on voicera_network, add its upstream here.
upstream voicera_backend_up {
    server voicera_backend:8000;
}
upstream voicera_voice_server_up {
    server voicera_voice_server:7860;
}

# HTTP → HTTPS redirect for voice.bindit.in. Also lets certbot renew via
# HTTP-01 in the future without needing to stop nginx, if we ever wire
# webroot-based renewal (currently we're on DNS-01 manual).
server {
    listen 80;
    server_name voice.bindit.in;

    # LE renewal challenge path (harmless when not in use)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server — the actual API surface exposed to external providers.
server {
    listen 443 ssl;
    http2 on;
    server_name voice.bindit.in;

    ssl_certificate     /etc/letsencrypt/live/voice.bindit.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.bindit.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    # Timeouts + buffers tuned for long-running voice sessions.
    proxy_connect_timeout 600s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    send_timeout          600s;
    client_max_body_size  100M;
    proxy_buffer_size     128k;
    proxy_buffers         4 256k;
    proxy_busy_buffers_size 256k;

    # Standard proxy headers.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket upgrade support (needed for jambonz/asterisk/neuracx WS streams).
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # /server/* → voice_server:7860/*  (strips the /server/ prefix)
    # NeuraCX (and any future provider) will hit wss://voice.bindit.in/server/<route>
    location /server/ {
        proxy_pass http://voicera_voice_server_up/;
    }

    # /backend/* → voicera_backend:8000/*
    location = /backend {
        return 301 /backend/;
    }
    location /backend/ {
        proxy_pass http://voicera_backend_up/;
    }
    location /api/ {
        proxy_pass http://voicera_backend_up/api/;
    }
    location /openapi.json {
        proxy_pass http://voicera_backend_up/openapi.json;
    }
}
